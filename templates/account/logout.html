{% extends 'base.html' %}
{% load static %}

{% block content %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/account/logout.css' %}">
{% endblock %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-lg">
                <div class="card-header logout-header text-center py-5">
                    <div class="logout-icon rounded-circle d-flex align-items-center justify-content-center mx-auto">
                        <i class="fas fa-sign-out-alt fa-3x"></i>
                    </div>
                    <h2 class="text-white font-weight-bold mb-0">Sign Out</h2>
                </div>

                <div class="card-body p-5 text-center">
                    <p class="text-muted mb-4">
                        Are you sure you want to sign out?<br>
                        You will need to sign in again to access your account.
                    </p>

                    <form method="post" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                        {% endif %}

                        <button type="submit"
                            class="btn btn-danger btn-block btn-lg mb-3 text-uppercase font-weight-bold btn-logout">
                            <i class="fas fa-sign-out-alt mr-2"></i> Yes, Sign Me Out
                        </button>
                    </form>

                    <p class="text-muted my-3">or</p>

                    <a href="{% url 'home' %}"
                        class="btn btn-outline-secondary btn-block btn-lg text-uppercase font-weight-bold btn-cancel">
                        <i class="fas fa-arrow-left mr-2"></i> Cancel
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Make sure you have Font Awesome in your base.html -->
<!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> -->

{% endblock content %}
